:2,ayahNumber:195,reflectionAr:`الإحسان إلى الحيوانات مثل قطة حور واللطف مع الجميع يدخلنا الجنة.`},{levelFrom:6,levelTo:7,verseText:`﴿ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴾`,surahName:`سورة الفاتحة`,surahNumber:1,ayahNumber:2,reflectionAr:`نشكر الله ونحمده دائماً على نعمة العقل والذكاء والصحة الجميلة.`},{levelFrom:7,levelTo:8,verseText:`﴿ وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا ﴾`,surahName:`سورة الإسراء`,surahNumber:17,ayahNumber:24,reflectionAr:`ندعو لبابا وماما الحبيبين بالرحمة والسعادة لأنهما يحبّان حور كثيراً.`},{levelFrom:8,levelTo:9,verseText:`﴿ وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ ﴾`,surahName:`سورة المائدة`,surahNumber:5,ayahNumber:2,reflectionAr:`التعاون ومساعدة الآخرين يجعلنا أقوياء ومحبوبين عند الله.`},{levelFrom:9,levelTo:10,verseText:`﴿ هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ ﴾`,surahName:`سورة الرحمن`,surahNumber:55,ayahNumber:60,reflectionAr:`من يعمل خيراً يجازيه الله خيراً أعظم وفرحاً كبيراً.`},{levelFrom:10,levelTo:11,verseText:`﴿ وَكَانَ فَضْلُ اللَّهِ عَلَيْكَ عَظِيمًا ﴾`,surahName:`سورة النساء`,surahNumber:4,ayahNumber:113,reflectionAr:`فضل الله علينا واسع وكبير في كل نعمة نراها ونعيشها.`},{levelFrom:11,levelTo:12,verseText:`﴿ فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ ﴾`,surahName:`سورة البقرة`,surahNumber:2,ayahNumber:152,reflectionAr:`نذكر الله بقلبنا ولساننا: سبحان الله، والحمد لله، ولا إله إلا الله.`},{levelFrom:12,levelTo:13,verseText:`﴿ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ ﴾`,surahName:`سورة البقرة`,surahNumber:2,ayahNumber:153,reflectionAr:`الصبر سر النجاح في كل لعبة وفي كل درس جديد نتعلمه.`},{levelFrom:13,levelTo:14,verseText:`﴿ وَقُولُوا لِلنَّاسِ حُسْنًا ﴾`,surahName:`سورة البقرة`,surahNumber:2,ayahNumber:83,reflectionAr:`الكلمة الطيبة والابتسامة الحلوة صدقة جميلة يحبها الله.`},{levelFrom:14,levelTo:15,verseText:`﴿ وَاللَّهُ يُحِبُّ الصَّابِرِينَ ﴾`,surahName:`سورة آل عمران`,surahNumber:3,ayahNumber:146,reflectionAr:`حب الله هو الفوز الأكبر، والصابرون يدخلون الجنة بغير حساب.`},{levelFrom:15,lev
